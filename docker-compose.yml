version: '3.8'

services:
  app:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: my-app-container-feature-monitor
    ports:
      - "8082:8000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - BRANCH_NAME=${BRANCH_NAME}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge