version: "3.8"

services:


  app:
    # 이 값들은 GitHub Actions에서 동적으로 주입될 환경 변수입니다.
    # .env.feature-monitor 파일에서 이 변수들을 읽어와 이미지를 지정합니다.
    image: ${IMAGE_NAME}:${IMAGE_TAG}

    # 컨테이너 이름을 고정하고 싶을 때 사용합니다.
    container_name: ${CONTAINER_NAME}

    ports:
      - "8082:8000" # 외부 포트 8082, 컨테이너 내부 포트 8000

    # 애플리케이션이 사용할 환경변수 파일을 지정합니다.
    env_file:
      - ./.env.feature-monitor # 서버의 홈 디렉토리에 생성될 파일

    # docker-compose 파일에서 직접 환경 변수를 주입할 수도 있습니다.
    environment:
      - NODE_ENV=development
      - BRANCH_NAME=feature-monitor

    # 컨테이너가 비정상 종료 시 자동으로 재시작합니다.
    restart: always