name: Deploy feature-monitor to NCP

# 'feature/monitor' 브랜치에 push가 발생할 때 워크플로우 실행
on:
  push:
    branches:
      - feature/monitor

jobs:
  build-and-deploy-feature-monitor:
    runs-on: ubuntu-latest
    env:
      NCP_CONTAINER_REGISTRY: ${{ secrets.NCP_CONTAINER_REGISTRY_URL }}
      NCP_REPOSITORY_NAME: ${{ secrets.NCP_REPOSITORY_NAME }}
      COMPOSE_FILE_NAME: docker-compose.feature-monitor.yml
      IMAGE_TAG: feature-monitor
      ENV_FILE_NAME: .env.feature-monitor

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set lowercase names
        run: |
          echo "LOWERCASE_GITHUB_REPO_NAME=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Define Image Name
        run: |
          echo "IMAGE_NAME=${{ env.NCP_CONTAINER_REGISTRY }}/${{ secrets.NCP_REPOSITORY_NAME }}/${{ env.LOWERCASE_GITHUB_REPO_NAME }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to NCP Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.NCP_CONTAINER_REGISTRY }}
          username: ${{ secrets.NCP_ACCESS_KEY }}
          password: ${{ secrets.NCP_SECRET_KEY }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-${{ github.sha }}

      - name: Deploy to NCP Server using Docker Compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.NCP_SERVER_HOST }}
          username: ${{ secrets.NCP_SERVER_USERNAME }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          script: |
            echo "Logging into NCP Container Registry on server..."
            docker login -u ${{ secrets.NCP_ACCESS_KEY }} -p ${{ secrets.NCP_SECRET_KEY }} ${{ env.NCP_CONTAINER_REGISTRY }}
            
            echo "Creating project directory..."
            mkdir -p ~/feature-monitor-deploy
            cd ~/feature-monitor-deploy
            
            echo "Creating environment file..."
            cat > ${{ env.ENV_FILE_NAME }} << EOF
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            NODE_ENV=development
            BRANCH_NAME=feature-monitor
            IMAGE_NAME=${{ env.IMAGE_NAME }}
            IMAGE_TAG=${{ env.IMAGE_TAG }}
            EOF
            
            echo "Creating docker-compose file..."
            cat > ${{ env.COMPOSE_FILE_NAME }} << EOF
            version: '3.8'
            
            services:
              app:
                image: \${IMAGE_NAME}:\${IMAGE_TAG}
                container_name: my-app-container-feature-monitor
                ports:
                  - "8082:8000"
                environment:
                  - NODE_ENV=\${NODE_ENV}
                  - BRANCH_NAME=\${BRANCH_NAME}
                  - OPENAI_API_KEY=\${OPENAI_API_KEY}
                restart: unless-stopped
                networks:
                  - app-network
            
            networks:
              app-network:
                driver: bridge
            EOF
            
            echo "Stopping existing services..."
            docker-compose -f ${{ env.COMPOSE_FILE_NAME }} --env-file ${{ env.ENV_FILE_NAME }} down || true
            
            echo "Force removing existing container if it exists..."
            docker stop my-app-container-feature-monitor || true
            docker rm my-app-container-feature-monitor || true
            
            echo "Pulling latest images..."
            docker-compose -f ${{ env.COMPOSE_FILE_NAME }} --env-file ${{ env.ENV_FILE_NAME }} pull
            
            echo "Starting services with docker-compose..."
            docker-compose -f ${{ env.COMPOSE_FILE_NAME }} --env-file ${{ env.ENV_FILE_NAME }} up -d
            
            echo "Cleaning up old images..."
            docker image prune -af
            
            echo "Deployment completed successfully!"